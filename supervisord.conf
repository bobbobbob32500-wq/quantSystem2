; supervisord 配置 — 量化交易辅助系统进程守护
; 使用方式: supervisord -c supervisord.conf
; 管理命令: supervisorctl -c supervisord.conf status/restart/stop quant_system

[supervisord]
logfile=data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=data/logs/supervisord.pid
childlogdir=data/logs/

[program:quant_system]
command=python main.py
directory=%(here)s
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=data/logs/quant_system_stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=data/logs/quant_system_stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=PYTHONUNBUFFERED="1"

[supervisorctl]
serverurl=unix://data/logs/supervisor.sock

[unix_http_server]
file=data/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
