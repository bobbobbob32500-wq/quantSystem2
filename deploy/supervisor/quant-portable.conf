[program:quant-portable-service]
directory=/opt/quant-system
command=/opt/quant-system/.venv/bin/python run_service.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/opt/quant-system/logs/supervisor/quant-portable-service.log
stderr_logfile=/opt/quant-system/logs/supervisor/quant-portable-service.err.log
environment=PYTHONUNBUFFERED="1"

[program:quant-portable-dashboard]
directory=/opt/quant-system
command=/opt/quant-system/.venv/bin/python start_dashboard.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/opt/quant-system/logs/supervisor/quant-portable-dashboard.log
stderr_logfile=/opt/quant-system/logs/supervisor/quant-portable-dashboard.err.log
environment=PYTHONUNBUFFERED="1",DASHBOARD_HOST="0.0.0.0",DASHBOARD_PORT="8501"

[program:quant-portable-api]
directory=/opt/quant-system
command=/opt/quant-system/.venv/bin/python src/api/app.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/opt/quant-system/logs/supervisor/quant-portable-api.log
stderr_logfile=/opt/quant-system/logs/supervisor/quant-portable-api.err.log
environment=PYTHONUNBUFFERED="1",MOBILE_API_HOST="0.0.0.0",MOBILE_API_PORT="8000"
